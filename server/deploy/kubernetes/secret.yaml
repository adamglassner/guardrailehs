# Replace every value (or create this secret with your own tooling and delete this file from kustomization.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: guardrail-secrets
type: Opaque
stringData:
  GR_DB_CONNECTION: "Host=postgres.example.internal;Database=guardrail;Username=guardrail;Password=change-me;SSL Mode=Require;Maximum Pool Size=40"
  GR_S3_ACCESS_KEY: change-me
  GR_S3_SECRET_KEY: change-me
  GR_ADMIN_USERNAME: admin
  GR_ADMIN_PASSWORD: change-me-please
  GR_METRICS_TOKEN: change-me-to-a-long-random-string
