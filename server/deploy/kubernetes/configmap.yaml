apiVersion: v1
kind: ConfigMap
metadata:
  name: guardrail-config
data:
  GR_DB: postgres
  GR_STORAGE: s3
  GR_S3_ENDPOINT: "https://s3.us-east-1.amazonaws.com"   # MinIO: http://minio.minio:9000   R2: https://<account>.r2.cloudflarestorage.com
  GR_S3_REGION: us-east-1
  GR_S3_BUCKET: guardrail-files
  GR_S3_PATH_STYLE: "false"                            # "true" for MinIO
  GR_TRUST_PROXY: "true"
  GR_ORG_NAME: "My organization"
