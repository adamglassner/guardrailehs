name: AI test data fetch (temporary)
on:
  push:
    branches: [ai-testdata-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq >/dev/null
      - name: Model
        run: |
          mkdir -p out/model
          curl -sSfL -o out/model/yolox_s.onnx https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_s.onnx
          sha256sum out/model/yolox_s.onnx | tee out/model/SHA256
          ls -la out/model
      - name: Videos from Wikimedia Commons
        env:
          UA: "GuardrailEHS-test-fetch/1.0 (https://github.com/adamglassner/guardrailehs)"
        run: |
          mkdir -p out/videos raw
          : > names.txt
          printf 'manual\tFile:%s\n' 'Multiple cars rear-end collision on highway.webm' >> names.txt
          printf 'manual\tFile:%s\n' 'The van in front suddenly changed lanes and caused the vehicle to rear-end collision.webm' >> names.txt
          printf 'manual\tFile:%s\n' 'The speeding car rear-ended into the truck in front, and the front hood was blown open.webm' >> names.txt
          printf 'manual\tFile:%s\n' 'Speeding electric motorcycle crashes into silver-gray van.webm' >> names.txt
          printf 'manual\tFile:%s\n' 'The car hit the woman crossing the zebra crossing and the white car on the left at the exit of the roundabout at the same time.webm' >> names.txt
          printf 'manual\tFile:%s\n' 'The e-scooter rider hit the car and then rebounded and hit another e-scooter rider, 2024-11-18.webm' >> names.txt
          printf 'manual\tFile:%s\n' 'White cars hit the lane divider at high speed on the highway.webm' >> names.txt
          printf 'manual\tFile:%s\n' 'INSANE Car Crash caught on TeslaCam- Kia Soul flying through air!.webm' >> names.txt
          printf 'manual\tFile:%s\n' 'Distracted woman driver crashes Turo rental car into mailbox in Snohomish County, Washington (August 2025).webm' >> names.txt
          printf 'manual\tFile:%s\n' 'Reckless Driver Yanked Out of Car After Swerving at Deputy During Chase.webm' >> names.txt
          printf 'manual\tFile:%s\n' 'Car accident in Kranj (Slovenia) Rover 400 vs Renault Clio.webm' >> names.txt
          printf 'manual\tFile:%s\n' '400 SB Crash.webm' >> names.txt
          printf 'manual\tFile:%s\n' '2ES6 car crash.webm' >> names.txt
          printf 'manual\tFile:%s\n' 'Parking Gate Crash.webm' >> names.txt
          printf 'manual\tFile:%s\n' 'Dashcam Video Shows Florida Trooper Hit By Car.webm' >> names.txt
          printf 'manual\tFile:%s\n' 'Dashcam Shows Trooper Chasing Down Driver Who Hit Her Patrol Car.webm' >> names.txt
          printf 'manual\tFile:%s\n' 'Video Shows Suspect Crash Stolen Amazon Truck Into Cars During Wild Police Pursuit.webm' >> names.txt
          printf 'manual\tFile:%s\n' 'Las Vegas Boulevard 4 Car Accident No.2.webm' >> names.txt
          printf 'manual\tFile:%s\n' 'Fatal Hit and Run Collision Involving Scooter.webm' >> names.txt
          printf 'manual\tFile:%s\n' 'Fatal Hit and Run Traffic Collision NR24134dm.webm' >> names.txt
          printf 'manual\tFile:%s\n' 'Felony Hit and Run Traffic Collision 1-22-2024 NR24209rc.webm' >> names.txt
          printf 'manual\tFile:%s\n' 'Pedestrian killed in Hit and Run Traffic Collision NR24121ktdm.webm' >> names.txt
          printf 'manual\tFile:%s\n' 'EGM TEMMUZ 2022 Kaza 1.webm' >> names.txt
          printf 'manual\tFile:%s\n' '80,000 pound truck loses brakes and heads for a school bus in Ohio (January 2021).webm' >> names.txt
          printf 'manual\tFile:%s\n' 'Boxtruck carnage on Friday the 13th at the 11foot8 bridge.webm' >> names.txt
          printf 'manual\tFile:%s\n' 'Dash cam footage shows driver ignoring barricades, nearly hitting people.webm' >> names.txt
          printf 'manual\tFile:%s\n' 'Connect to the opposite lane and bypass the traffic accident section.webm' >> names.txt
          printf 'manual\tFile:%s\n' 'Cäcilienbrücke Oldenburg (Dashcam).webm' >> names.txt
          printf 'manual\tFile:%s\n' 'Dashcam film.webm' >> names.txt
          printf 'manual\tFile:%s\n' 'Speeding non-motorized vehicle crashes into gully next to road.webm' >> names.txt
          echo "== candidates =="; cat names.txt
          n=0
          cut -f2 names.txt | while read -r title; do
            
            enc=$(jq -rn --arg t "$title" '$t|@uri')
            info=$(curl -sS -A "$UA" "https://commons.wikimedia.org/w/api.php?action=query&titles=${enc}&prop=imageinfo&iiprop=url|size|mediatype|extmetadata&format=json")
            url=$(echo "$info" | jq -r '.query.pages[].imageinfo[0].url // empty')
            size=$(echo "$info" | jq -r '.query.pages[].imageinfo[0].size // 0')
            dur=$(echo "$info" | jq -r '.query.pages[].imageinfo[0].duration // 0')
            lic=$(echo "$info" | jq -r '.query.pages[].imageinfo[0].extmetadata.LicenseShortName.value // "?"')
            desc=$(echo "$info" | jq -r '.query.pages[].imageinfo[0].extmetadata.ImageDescription.value // ""' | sed 's/<[^>]*>//g' | tr '\n\t' '  ' | cut -c1-400)
            echo "$title | $size bytes | ${dur}s | $lic"
            [ -z "$url" ] && continue
            [ "$size" -gt 150000000 ] && continue
            n=$((n+1))
            safe=$(printf '%02d' $n)_$(echo "$title" | sed 's/^File://; s/\.[a-z0-9]*$//; s/[^A-Za-z0-9]\+/_/g' | cut -c1-60)
            curl -sSfL -A "$UA" -o "raw/$safe.src" "$url" || continue
            ffmpeg -nostdin -loglevel error -y -i "raw/$safe.src" -t 120 -vf "scale='min(960,iw)':-2" -an -c:v libx264 -preset veryfast -crf 27 "out/videos/$safe.mp4" || continue
            printf '%s\t%s\t%s\t%s\t%s\n' "$safe.mp4" "$title" "$lic" "$dur" "$desc" >> out/videos/INDEX.tsv
            rm -f "raw/$safe.src"
          done
          ls -la out/videos; du -sh out
      - name: OpenCV sample (no crash)
        run: curl -sSfL -o raw/vtest.avi https://github.com/opencv/opencv/raw/4.x/samples/data/vtest.avi && ffmpeg -nostdin -loglevel error -y -i raw/vtest.avi -c:v libx264 -preset veryfast -crf 27 out/videos/00_opencv_vtest_pedestrians.mp4 || true
      - name: Push to orphan branch ai-testdata
        run: |
          cd out
          git init -q -b ai-testdata
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Temporary AI test data (YOLOX-S model, Apache-2.0; Wikimedia Commons videos, see INDEX.tsv)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ai-testdata
