name: refs-shots
on:
  push:
    branches: [refs-shots]
permissions:
  contents: write
jobs:
  shots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build src/Guardrail.Desktop -c Release -o out
      - name: Screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $data = Join-Path $env:APPDATA 'Guardrail'
          New-Item -ItemType Directory -Force $data | Out-Null
          New-Item -ItemType Directory -Force shots | Out-Null
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "Screen $($b.Width)x$($b.Height)"
          foreach ($shot in @(@('Light','references'), @('Dark','references/placards'), @('Light','references/placards'), @('Light','references/ghs'), @('Dark','references/workplace'), @('Light','references/fleet'), @('Light','references/osha'), @('Dark','references/numbers'))) {
            @{ Theme = $shot[0] } | ConvertTo-Json | Set-Content (Join-Path $data 'settings.json')
            $p = Start-Process out/Guardrail.exe -ArgumentList '--page', $shot[1] -PassThru
            Start-Sleep -Seconds 9
            if ($p.HasExited) { throw "exited on $($shot[1])" }
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots/$($shot[1].Replace('/','-'))-$($shot[0]).png")
            Stop-Process -Id $p.Id -Force
            Start-Sleep -Seconds 2
          }
      - name: Commit
        shell: pwsh
        run: |
          git config user.name ci; git config user.email ci@example.com
          git add shots; git commit -m "shots"; git push
