name: erg-fetch
on: push
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download ERG 2024 and convert to text
        run: |
          set -x
          sudo apt-get install -y poppler-utils >/dev/null
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          mkdir -p out
          URL=https://tc.canada.ca/sites/default/files/2024-04/2024-emergency-response-guidebook.pdf
          echo "$URL" > out/url.txt
          curl -sSL -A "$UA" "$URL" -o erg.pdf
          head -c 300 erg.pdf | strings | head
          ls -la erg.pdf; sha256sum erg.pdf | tee out/sha256.txt
          pdftoppm -f 10 -l 11 -r 110 -png erg.pdf out/placards
          pdftoppm -f 19 -l 19 -r 90 -png erg.pdf out/ghs
          ls -la out
      - name: Commit
        run: |
          git config user.name ci; git config user.email ci@example.com
          git add out; git commit -m "ERG pages"; git push
